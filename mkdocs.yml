site_name: FormatBook
site_description: GWAS summary-statistics format specifications for GWASLab
repo_name: formatbook
repo_url: https://github.com/Cloufield/formatbook
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.prune
    - navigation.top
    - toc.follow
  palette:
    primary: blue
    accent: blue

